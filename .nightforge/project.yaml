id: nightforge
name: Nightforge
path: /opt/nightforge/projects/nightforge

deployment:
  policy: direct-prod
  testCommand: npm test
  lintCommand: npm run lint
  typecheckCommand: npx tsc --noEmit
  buildCommand: npm run build
  # Runs inside the staged release dir: installs runtime deps and marks the
  # release pending. The external watchdog (root systemd timer) performs the
  # actual restart — Nightforge never restarts itself.
  deployCommand: bash ops/prepare-release.sh
  # Verifies the staged release is bootable without touching the live service.
  healthcheckCommand: bash ops/self-verify.sh
  # Symlink revert is handled by the deployer; the watchdog reconciles state.
  rollbackCommand: node -e process.exit(0)

concurrency:
  # Only one writer on Nightforge's own codebase at a time.
  maxWriteTasks: 1
  maxReadonlyTasks: 3

agent:
  defaultModel: qwen3.8
  maxAttempts: 3
  maxRuntimeMinutes: 90
  maxTicketCostUsd: 8

permissions:
  allowedServices:
    - github
  prohibitedActions:
    - rotate-production-secrets
    - delete-production-database
    - disable-authentication
    - modify-release-watchdog
    - modify-systemd-units
    - flush-redis

risk:
  approvalRequiredFor:
    - billing
    - authentication
    - destructive-migration
    - release-pipeline-changes
